<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>图片压缩工具（纯前端 · 免安装）</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --line:#e3e6ea; --text:#1f2329; --muted:#8a9099;
    --pri:#2f6fed; --pri2:#1b4fc4; --ok:#1f9d55; --warn:#e0a106; --bad:#d94040;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--muted);margin:0 0 16px;font-size:13px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .row.mb{margin-bottom:10px;}
  button{font-family:inherit;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--text);
    padding:8px 14px;border-radius:8px;cursor:pointer;transition:.15s;}
  button:hover{border-color:var(--pri);color:var(--pri);}
  button.primary{background:var(--pri);border-color:var(--pri);color:#fff;}
  button.primary:hover{background:var(--pri2);border-color:var(--pri2);color:#fff;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  label.fld{display:inline-flex;align-items:center;gap:6px;color:var(--muted);}
  input[type=number],select,input[type=text]{font-family:inherit;font-size:14px;border:1px solid var(--line);
    border-radius:7px;padding:6px 8px;background:#fff;color:var(--text);}
  input[type=number]{width:78px;}
  .sep{width:1px;height:22px;background:var(--line);margin:0 4px;}
  .chk{display:inline-flex;align-items:center;gap:5px;color:var(--text);}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .box{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:#fafbfc;}
  .box .t{color:var(--muted);font-size:12px;margin-bottom:6px;}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);
    cursor:pointer;transition:.15s;background:#fafbfc;}
  .drop.over{border-color:var(--pri);color:var(--pri);background:#f0f5ff;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  th{color:var(--muted);font-weight:500;}
  td.num{font-variant-numeric:tabular-nums;}
  .thumb{width:54px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#fff;}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#eef2ff;color:var(--pri);margin-left:6px;}
  .tag.gif{background:#fdeef0;color:#c0344a;}
  .tag.png{background:#eafaf0;color:#1f9d55;}
  .ok{color:var(--ok);} .bad{color:var(--bad);} .warn{color:var(--warn);}
  .preview{display:flex;gap:24px;flex-wrap:wrap;margin-top:6px;}
  .preview figure{margin:0;text-align:center;}
  .preview figcaption{color:var(--muted);font-size:12px;margin-top:4px;}
  .preview img{max-width:240px;max-height:240px;border:1px solid var(--line);border-radius:8px;background:#fff;}
  .hidden{display:none;}
  .log{font-size:12px;color:var(--muted);max-height:160px;overflow:auto;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.6;}
  .log b{color:var(--text);}
  .banner{background:#fff7e6;border:1px solid #ffe1a8;color:#9a6b00;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px;}
  .pill{font-size:11px;padding:2px 8px;border-radius:10px;background:#eef2ff;color:var(--pri);}
</style>
</head>
<body>
<div class="wrap">
  <h1>图片压缩工具</h1>
  <p class="sub">纯前端 · 免安装 · 不依赖任何后端服务。双击本文件即可使用，换电脑 / 重启都不受影响。</p>

  <div id="cdnWarn" class="banner hidden">注意：GIF / APNG 动图功能需要联网加载编码库（首次打开需联网，之后浏览器会缓存）。静态图（JPEG / PNG / WebP）压缩完全离线可用。</div>

  <div class="card">
    <div class="drop" id="drop">把图片拖到这里，或点击选择文件 / 文件夹</div>
    <div class="row mb" style="margin-top:12px;">
      <button onclick="document.getElementById('fileInput').click()">选择文件</button>
      <button onclick="document.getElementById('dirInput').click()">选择文件夹</button>
      <input id="fileInput" type="file" accept="image/*" multiple class="hidden" />
      <input id="dirInput" type="file" accept="image/*" webkitdirectory directory multiple class="hidden" />
      <span class="sep"></span>
      <button id="btnCompress" class="primary" onclick="runCompress()">开始压缩</button>
      <button id="btnZip" onclick="downloadZip()" disabled>打包下载 ZIP</button>
      <button id="btnFolder" onclick="saveToFolder()" disabled>选择保存文件夹</button>
      <button onclick="clearAll()">清空</button>
    </div>
    <div class="row" style="color:var(--muted);font-size:12px;">
      <span id="countTip">尚未添加文件</span>
      <span id="fsHint"></span>
    </div>
  </div>

  <div class="card">
    <div class="grid">
      <div class="box">
        <div class="t">按比例缩放（%）</div>
        <input type="number" id="scale" value="100" min="1" max="100" /> <label class="fld">100 = 不变</label>
      </div>
      <div class="box">
        <div class="t">质量（JPEG / WebP，0.1–1）</div>
        <input type="number" id="quality" value="0.85" min="0.1" max="1" step="0.05" />
      </div>
      <div class="box">
        <div class="t">最大色数（GIF）</div>
        <select id="colors">
          <option>256</option><option>192</option><option>128</option><option>96</option>
          <option>64</option><option>48</option><option>32</option><option>16</option><option>8</option>
        </select>
      </div>
      <div class="box">
        <div class="t">抽帧（GIF，每 N 帧保留 1 帧）</div>
        <select id="frameStep">
          <option value="1">1（保留全部）</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option>
        </select>
      </div>
      <div class="box">
        <div class="t">目标体积（智能压缩用）</div>
        <input type="number" id="target" placeholder="留空=不限" min="1" />
        <select id="targetUnit"><option value="1024">KB</option><option value="1048576">MB</option></select>
      </div>
    </div>
    <div class="row mb" style="margin-top:12px;">
      <label class="chk"><input type="checkbox" id="smart" /> 智能压缩（按目标体积自动优化：降尺寸 → 抽帧 → 降色数）</label>
    </div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>预览</th><th>文件名</th><th>类型</th><th>原始</th><th>压缩后</th><th>节省</th><th>参数</th><th></th></tr></thead>
      <tbody id="fileRows"><tr><td colspan="8" style="color:var(--muted);text-align:center;padding:20px;">还没有文件</td></tr></tbody>
    </table>
    <div id="preview" class="preview hidden"></div>
  </div>

  <div class="card">
    <div class="row mb"><b>运行日志</b></div>
    <div id="log" class="log"></div>
  </div>
</div>

<!-- 编码库（仅 GIF / APNG 需要；静态图走 Canvas 不需联网） -->
<script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.2/upng.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const logEl = $('log');
  function log(msg, cls){ const d=document.createElement('div'); if(cls) d.className=cls; d.innerHTML=msg; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }
  function libOK(name){ return typeof window[name] !== 'undefined'; }
  if(!libOK('GifReader') || !libOK('gifenc') || !libOK('UPNG') || !libOK('JSZip')){
    $('cdnWarn').classList.remove('hidden');
  }
  $('fsHint').textContent = ('showDirectoryPicker' in window) ? '当前环境支持直接写入文件夹' : '当前环境不支持直接写文件夹（请用 ZIP 下载）';

  let items = []; // {file,name,decoded,out:{blob,bytes,w,h,note},previewUrl,outUrl,rowEl}

  // ---------- 文件接收 ----------
  $('fileInput').addEventListener('change', e=>addFiles(e.target.files));
  $('dirInput').addEventListener('change', e=>addFiles(e.target.files));
  const drop=$('drop');
  ;['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
  ;['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop', e=> addFiles(e.dataTransfer.files));
  drop.addEventListener('click', ()=> $('fileInput').click());

  async function addFiles(fileList){
    const files = Array.from(fileList).filter(f=>f.type.startsWith('image/') || /\.(gif|png|jpe?g|webp|apng)$/i.test(f.name));
    for(const f of files){
      const item = {file:f, name:f.name, decoded:null, out:null, previewUrl:null, outUrl:null};
      items.push(item);
      try{
        item.decoded = await decode(f);
        item.previewUrl = URL.createObjectURL(f);
      }catch(err){
        log('解码失败：'+f.name+' — '+err.message, 'bad');
      }
    }
    refreshTable();
    log('已添加 '+files.length+' 个文件，共 '+items.length+' 个。');
  }

  // ---------- 解码 ----------
  async function decode(file){
    const t = file.type;
    if(t === 'image/gif'){
      const buf = new Uint8Array(await file.arrayBuffer());
      if(!libOK('GifReader')) throw new Error('GIF 库未加载（需联网）');
      const r = new GifReader(buf);
      const w=r.width, h=r.height;
      const frames=[]; const px=new Uint8ClampedArray(w*h*4); const delays=[];
      for(let i=0;i<r.numFrames();i++){
        r.decodeAndBlitFrameRGBA(i, px);
        frames.push(new Uint8ClampedArray(px));
        const fi = r.frameInfo(i);
        delays.push((fi.delay||10)*10); // 百分秒 -> 毫秒
      }
      return {kind:'gif', w, h, frames, delays};
    }
    if(t === 'image/png' || /\.apng$/i.test(file.name)){
      const buf = await file.arrayBuffer();
      if(libOK('UPNG')){
        try{
          const img = UPNG.decode(buf);
          const fr = UPNG.toRGBA8(img);
          const delays = (img.frames||[]).map(f=> (f.delay!==undefined? f.delay : (f.t!==undefined? f.t : 100)));
          if(fr.length>1) return {kind:'png', w:img.width, h:img.height, frames:fr, delays, apng:true};
          return {kind:'png', w:img.width, h:img.height, frames:fr, delays:[100], apng:false};
        }catch(e){ /* 退化到静态 */ }
      }
    }
    // 静态图：交给 Canvas
    const bmp = await createImageBitmap(file);
    return {kind:'static', bitmap:bmp, w:bmp.width, h:bmp.height, type:t||'image/png'};
  }

  // ---------- 工具 ----------
  function resizeRGBA(src, sw, sh, dw, dh){
    const c=document.createElement('canvas'); c.width=sw; c.height=sh;
    const ctx=c.getContext('2d'); const id=ctx.createImageData(sw,sh); id.data.set(src); ctx.putImageData(id,0,0);
    const c2=document.createElement('canvas'); c2.width=dw; c2.height=dh;
    c2.getContext('2d').drawImage(c,0,0,dw,dh);
    return new Uint8ClampedArray(c2.getContext('2d').getImageData(0,0,dw,dh).data.buffer);
  }
  function fmtBytes(n){ if(n==null) return '—'; if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(2)+' MB'; }
  function outName(name, kind){
    const dot=name.lastIndexOf('.'); const base= dot>0? name.slice(0,dot): name;
    if(kind==='gif') return base+'.gif';
    if(kind==='png') return base+'_comp.png';
    return base+'_comp'+(dot>0?name.slice(dot):'.png');
  }
  function readParams(){
    const targetRaw = parseFloat($('target').value);
    const unit = parseFloat($('targetUnit').value);
    const targetBytes = isNaN(targetRaw)? null : Math.round(targetRaw*unit);
    return {
      scale: Math.min(100, Math.max(1, parseFloat($('scale').value)||100)),
      quality: Math.min(1, Math.max(0.1, parseFloat($('quality').value)||0.85)),
      colors: parseInt($('colors').value,10)||256,
      frameStep: parseInt($('frameStep').value,10)||1,
      smart: $('smart').checked,
      targetBytes
    };
  }

  // ---------- 压缩：静态 ----------
  async function compressStatic(dec, p){
    const bmp=dec.bitmap;
    let scale=p.scale/100;
    const baseW=bmp.width, baseH=bmp.height;
    let w=Math.max(1,Math.round(baseW*scale)), h=Math.max(1,Math.round(baseH*scale));
    let type = dec.type;
    const makeBlob = q => new Promise(res=>{
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(bmp,0,0,w,h);
      c.toBlob(b=>res(b), type, q);
    });
    let blob = await makeBlob(p.quality);
    let note = w+'x'+h;
    if(p.smart && p.targetBytes && blob.size>p.targetBytes){
      // 先降质量（仅对支持质量的格式有效）
      if(type==='image/jpeg' || type==='image/webp'){
        let lo=0.1, hi=p.quality;
        for(let i=0;i<8;i++){ const mid=(lo+hi)/2; const b=await makeBlob(mid); if(b.size>p.targetBytes) hi=mid; else lo=mid; }
        blob=await makeBlob(lo);
      }
      // 仍超标则降尺寸
      while(blob.size>p.targetBytes && scale>0.5){
        scale*=0.85; w=Math.max(1,Math.round(baseW*scale)); h=Math.max(1,Math.round(baseH*scale));
        blob=await makeBlob(lo);
      }
      note = w+'x'+h+' / q='+lo.toFixed(2);
    }
    return {blob, w, h, note, bytes:blob.size};
  }

  // ---------- 压缩：GIF ----------
  function compressGIF(dec, p){
    if(!libOK('gifenc')) throw new Error('GIF 库未加载（需联网）');
    const doEncode=(scale,colors,step)=>{
      const sw=dec.w, sh=dec.h;
      const dw=Math.max(1,Math.round(sw*scale/100)), dh=Math.max(1,Math.round(sh*scale/100));
      let frames=dec.frames, delays=dec.delays, w=sw, h=sh;
      if(dw!==sw||dh!==sh){ frames=dec.frames.map(f=>resizeRGBA(f,sw,sh,dw,dh)); w=dw; h=dh; }
      if(step>1){ const f=[],d=[]; for(let i=0;i<frames.length;i+=step){ f.push(frames[i]); d.push((delays[i]||100)*step);} frames=f; delays=d; }
      const gif=gifenc.GIF();
      for(let i=0;i<frames.length;i++){
        const palette=gifenc.quantize(frames[i], colors, {format:'rgb565'});
        const idx=gifenc.applyPalette(frames[i], palette, 'rgb565');
        gif.writeFrame(idx, w, h, {palette, delay: delays[i]||100});
      }
      gif.finish();
      return {bytes:gif.bytes(), w, h, nframes:frames.length};
    };
    let scale=p.scale, colors=p.colors, step=p.frameStep;
    let res=doEncode(scale,colors,step);
    if(p.smart && p.targetBytes && res.bytes.length>p.targetBytes){
      for(const s of [95,90,85,80,75,70,60,50,40]){ scale=s; res=doEncode(scale,colors,step); if(res.bytes.length<=p.targetBytes)break; }
      if(res.bytes.length>p.targetBytes) for(const st of [2,3,4,5,6]){ step=st; res=doEncode(scale,colors,step); if(res.bytes.length<=p.targetBytes)break; }
      if(res.bytes.length>p.targetBytes) for(const c of [192,128,96,64,48,32,16,8]){ colors=c; res=doEncode(scale,colors,step); if(res.bytes.length<=p.targetBytes)break; }
    }
    return {blob:new Blob([res.bytes],{type:'image/gif'}), w:res.w, h:res.h, note:res.nframes+'帧 / '+colors+'色 / '+scale+'%', bytes:res.bytes.length};
  }

  // ---------- 压缩：PNG / APNG ----------
  function compressPNG(dec, p){
    if(!libOK('UPNG')) throw new Error('PNG 库未加载（需联网）');
    const sw=dec.w, sh=dec.h;
    let frames=dec.frames, w=sw, h=sh, delays=dec.delays;
    if(p.scale!==100){ const dw=Math.max(1,Math.round(sw*p.scale/100)), dh=Math.max(1,Math.round(sh*p.scale/100)); frames=dec.frames.map(f=>resizeRGBA(f,sw,sh,dw,dh)); w=dw; h=dh; }
    let bytes, note;
    try{
      if(frames.length>1){ bytes=UPNG.encode(frames, w, h, 8, {delay:delays, loop:0}); note='APNG '+frames.length+'帧'; }
      else { bytes=UPNG.encode(frames, w, h, 8, {}); note='PNG'; }
    }catch(e){ bytes=UPNG.encode([dec.frames[0]], dec.w, dec.h, 8, {}); note='PNG(静态回退)'; }
    return {blob:new Blob([bytes],{type:'image/png'}), w, h, note, bytes:bytes.length};
  }

  async function compressOne(item, p){
    if(!item.decoded) return;
    const d=item.decoded;
    let out;
    if(d.kind==='static') out=await compressStatic(d,p);
    else if(d.kind==='gif') out=compressGIF(d,p);
    else if(d.kind==='png') out=compressPNG(d,p);
    if(item.outUrl) URL.revokeObjectURL(item.outUrl);
    item.out=out;
    item.outUrl=URL.createObjectURL(out.blob);
    item.outKind = d.kind==='gif'?'gif':(d.apng?'png':'img');
    item.outName = outName(item.name, d.kind==='gif'?'gif':(d.kind==='png'?'png':'img'));
  }

  // ---------- 执行 ----------
  async function runCompress(){
    const p=readParams();
    const todo=items.filter(i=>i.decoded);
    if(!todo.length){ log('没有可压缩的文件。','warn'); return; }
    $('btnCompress').disabled=true;
    log('开始压缩 '+todo.length+' 个文件…');
    for(const it of todo){
      try{ await compressOne(it,p); }
      catch(err){ log('压缩失败 '+it.name+'：'+err.message,'bad'); }
    }
    $('btnCompress').disabled=false;
    $('btnZip').disabled=false; $('btnFolder').disabled=false;
    refreshTable();
    const saved=items.filter(i=>i.out).reduce((s,i)=>s+(i.file.size-i.out.bytes),0);
    log('压缩完成。共节省 '+fmtBytes(Math.max(0,saved))+'。','ok');
  }

  // ---------- 表格 / 预览 ----------
  function refreshTable(){
    const tb=$('fileRows');
    if(!items.length){ tb.innerHTML='<tr><td colspan="8" style="color:var(--muted);text-align:center;padding:20px;">还没有文件</td></tr>'; $('countTip').textContent='尚未添加文件'; return; }
    tb.innerHTML='';
    $('countTip').textContent='共 '+items.length+' 个文件'+(items.some(i=>!i.decoded)?'（含解码失败）':'');
    items.forEach((it,idx)=>{
      const d=it.decoded;
      const kindTag = !d? '' : d.kind==='gif'? '<span class="tag gif">GIF</span>' : d.kind==='png'? (d.apng?'<span class="tag png">APNG</span>':'<span class="tag png">PNG</span>') : '<span class="tag">静态</span>';
      const tr=document.createElement('tr');
      const o=it.out;
      const saved = o? (it.file.size-o.bytes) : 0;
      const savedPct = o&&it.file.size? (saved/it.file.size*100) : 0;
      tr.innerHTML =
        '<td>'+(it.previewUrl?'<img class="thumb" src="'+it.previewUrl+'">':'—')+'</td>'+
        '<td>'+escapeHtml(it.name)+'</td>'+
        '<td>'+kindTag+'</td>'+
        '<td class="num">'+fmtBytes(it.file.size)+'</td>'+
        '<td class="num">'+(o?fmtBytes(o.bytes):'<span style="color:var(--muted)">未压缩</span>')+'</td>'+
        '<td class="num '+(saved>0?'ok':'')+'">'+(o?(saved>0?'−'+savedPct.toFixed(0)+'%':'+0%'):'—')+'</td>'+
        '<td>'+(o?escapeHtml(o.note):'—')+'</td>'+
        '<td>'+(o?'<button onclick="showPreview('+idx+')">预览</button>':'')+'</td>';
      tb.appendChild(tr);
    });
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  window.showPreview=function(idx){
    const it=items[idx]; const pv=$('preview');
    pv.classList.remove('hidden');
    let html='<figure><img src="'+it.previewUrl+'"><figcaption>原图 · '+fmtBytes(it.file.size)+'</figcaption></figure>';
    if(it.outUrl) html+='<figure><img src="'+it.outUrl+'"><figcaption>压缩后 · '+fmtBytes(it.out.bytes)+' · '+escapeHtml(it.out.note)+'</figcaption></figure>';
    pv.innerHTML=html;
  };

  // ---------- 输出 ----------
  async function downloadZip(){
    if(!items.some(i=>i.out)){ log('请先压缩。','warn'); return; }
    if(!libOK('JSZip')){ log('ZIP 库未加载（需联网），改用逐个下载。','warn'); return downloadEach(); }
    const zip=new JSZip();
    items.filter(i=>i.out).forEach(i=> zip.file(i.outName, i.out.blob));
    const content=await zip.generateAsync({type:'blob'});
    triggerDownload(content, 'compressed_images.zip');
    log('已打包 ZIP（'+items.filter(i=>i.out).length+' 个文件）。','ok');
  }
  function downloadEach(){
    items.filter(i=>i.out).forEach(i=> triggerDownload(i.out.blob, i.outName));
    log('已逐个下载。');
  }
  function triggerDownload(blob, name){
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000); a.remove();
  }
  async function saveToFolder(){
    if(!('showDirectoryPicker' in window)){ log('当前环境（非 https / localhost）不支持直接写文件夹，请用 ZIP 下载。','warn'); return; }
    if(!items.some(i=>i.out)){ log('请先压缩。','warn'); return; }
    try{
      const dir=await window.showDirectoryPicker();
      const done=[];
      for(const it of items.filter(i=>i.out)){
        const h=await dir.getFileHandle(it.outName,{create:true});
        const w=await h.createWritable(); await w.write(it.out.blob); await w.close(); done.push(it.outName);
      }
      log('已直接写入所选文件夹：'+done.length+' 个文件。','ok');
    }catch(e){ if(e.name!=='AbortError') log('写入文件夹失败：'+e.message,'bad'); }
  }
  function clearAll(){
    items.forEach(i=>{ if(i.previewUrl)URL.revokeObjectURL(i.previewUrl); if(i.outUrl)URL.revokeObjectURL(i.outUrl); });
    items=[]; refreshTable(); $('preview').classList.add('hidden'); $('btnZip').disabled=true; $('btnFolder').disabled=true;
    log('已清空。');
  }

  log('就绪。添加文件后即可开始压缩。');
})();
</script>
</body>
</html>
